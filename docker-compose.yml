services:
  db:
    image: postgres:17
    container_name: ams_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ams
      POSTGRES_PASSWORD: ams_dev
      POSTGRES_DB: ams
    # Host 5433 para evitar choque con un PostgreSQL nativo que ya use 5432.
    ports:
      - "5433:5432"
    volumes:
      - ams_pgdata:/var/lib/postgresql/data
volumes:
  ams_pgdata:
